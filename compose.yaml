services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: humain
      POSTGRES_USER: humain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humain -d humain"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
      POSTGRES_HOST: db
      POSTGRES_DB: humain
      POSTGRES_USER: humain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      COUNTDOWN_TARGET: ${COUNTDOWN_TARGET:-}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000 --noreload"
volumes:
  postgres_data:
