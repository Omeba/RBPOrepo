{% if page_obj.has_other_pages %}<nav aria-label="Страницы">
{% if page_obj.has_previous %}<a href="?{{ query }}&amp;page={{ page_obj.previous_page_number }}">Назад</a>{% endif %}
<span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span>
{% if page_obj.has_next %}<a href="?{{ query }}&amp;page={{ page_obj.next_page_number }}">Далее</a>{% endif %}
</nav>{% endif %}
